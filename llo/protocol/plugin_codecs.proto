syntax="proto3";

package v1;
option go_package = ".;protocol";

// WARNING
// Use extreme caution making changes in this file
// All changes MUST be backwards compatible
// If the format changes in a backwards incompatible way, active DONs can
// become stuck permanently

// Observation CAN be changed as long as it doesn't break decode for legacy
// versions.
//
// i.e. adding new fields is ok
message LLOObservationProto {
    bytes attestedPredecessorRetirement = 1;
    bool shouldRetire = 2;
    // TODO: unixTimestampNanosecondsLegacy can be removed after this version
    // is rolled out everywhere
    int64 unixTimestampNanosecondsLegacy = 3;
    uint64 unixTimestampNanoseconds = 7;
    repeated uint32 removeChannelIDs = 4;
    // Maps are safe to use here because Observation serialization does not
    // need to be deterministic. Non-deterministic map serialization is
    // marginally more efficient than converting to tuples and guarantees
    // uniqueness.
    map<uint32, LLOChannelDefinitionProto> updateChannelDefinitions = 5;
    map<uint32, LLOStreamValue> streamValues = 6;
}

message LLOStreamValue {
    enum Type
    {
        Decimal = 0;
        Quote = 1;
        TimestampedStreamValue = 2;
    }
    Type type = 1;
    bytes value = 2;
}

message LLOStreamValueQuote{
    bytes bid = 1;
    bytes benchmark = 2;
    bytes ask = 3;
}

message LLOTimestampedStreamValue {
  uint64 observedAtNanoseconds = 1;
  LLOStreamValue streamValue = 2;
}

// LLOStreamHistoryRecord is one agreed aggregate value of a stream, with the
// timestamp it was observed at. Per-record timestamps are required: rounds are
// not evenly spaced, so time-weighted functions and gap detection cannot work
// from the window bounds alone.
message LLOStreamHistoryRecord {
  uint64 observedAtNanoseconds = 1;
  LLOStreamValue value = 2;
}

// LLOStreamHistoryChunkProto is one slot of the chunked ring layout: a run of
// consecutive history records for a single (streamID, aggregator) pair.
//
// Only the newest chunk of a window is ever rewritten; once a chunk is full it
// is immutable for as long as it is retained. That is what makes the per-round
// write cost a function of the chunk size rather than of the window depth.
message LLOStreamHistoryChunkProto {
  // Absolute chunk index, monotonically increasing over the life of the
  // window. The key holds only sequence mod MaxHistoryChunkSlots, so this is
  // what distinguishes a live chunk from a stale one left by an earlier lap of
  // the ring.
  uint64 sequence = 1;
  // Oldest first, newest last; observedAtNanoseconds strictly increasing.
  repeated LLOStreamHistoryRecord records = 2;
}

// LLOStreamHistoryHeaderProto is the index of a chunked history window: which
// chunks are retained, how full each one is, and when each one starts.
//
// It is sized so that every decision a round makes — is there enough depth,
// which chunks must be read, may this value be appended, which chunk falls out
// — can be taken from the header alone, without reading a single chunk.
message LLOStreamHistoryHeaderProto {
  // Capacity: the maximum depth required by any live channel/expression
  // referencing this pair. Zero means the pair is torn down.
  uint32 requiredCount = 1;
  // Absolute sequence of the oldest retained chunk. Zero when nothing is
  // stored.
  uint64 firstSequence = 2;
  // Records held by each retained chunk, oldest first. Every entry except the
  // last equals MaxHistoryChunkRecords; the last is in [1, MaxHistoryChunkRecords].
  repeated uint32 counts = 3;
  // observedAtNanoseconds of the first record of each retained chunk, parallel
  // to counts and strictly increasing. Denormalized so that evicting a chunk
  // does not require loading its successor to learn the window's new start.
  repeated uint64 chunkFirstObservationTimestampNanoseconds = 4;
  // observedAtNanoseconds of the newest record in the window, or 0 when empty.
  // The strictly-newer append rule is decided against this alone.
  uint64 lastObservationTimestampNanoseconds = 5;
}


message LLOChannelDefinitionProto {
    uint32 reportFormat = 1;
    repeated LLOStreamDefinition streams = 2;
    bytes opts = 3;
    bool tombstone = 4;
    uint32 source = 5;
    bool disableNilStreamValues = 6;
}

message LLOStreamDefinition {
    uint32 streamID = 1;
    uint32 aggregator = 2;
}

message LLOStreamObservationProto {
    bool valid = 1;
    bytes value = 2;
}

// Outcome CANNOT be changed in a backwards compatible way.
// Changes to outcome necessitate a new version of the protocol.

// NOTE: Outcome must serialize deterministically, hence use of repeated tuple instead of maps
message LLOOutcomeProtoV0 {
    string lifeCycleStage = 1;
    int64 observationTimestampNanoseconds = 2;
    repeated LLOChannelIDAndDefinitionProto channelDefinitions = 3;
    repeated LLOChannelIDAndValidAfterSecondsProto validAfterSeconds = 4;
    repeated LLOStreamAggregate streamAggregates = 5;
}

// NOTE: Outcome must serialize deterministically, hence use of repeated tuple instead of maps
message LLOOutcomeProtoV1 {
    string lifeCycleStage = 1;
    uint64 observationTimestampNanoseconds = 2;
    repeated LLOChannelIDAndDefinitionProto channelDefinitions = 3;
    repeated LLOChannelIDAndValidAfterNanosecondsProto validAfterNanoseconds = 4;
    repeated LLOStreamAggregate streamAggregates = 5;
}

message LLOChannelIDAndDefinitionProto {
    uint32 channelID = 1;
    LLOChannelDefinitionProto channelDefinition = 2;
}

message LLOChannelIDAndValidAfterSecondsProto {
    uint32 channelID = 1;
    uint32 validAfterSeconds = 2;
}

message LLOChannelIDAndValidAfterNanosecondsProto {
    uint32 channelID = 1;
    uint64 validAfterNanoseconds = 2;
}

message LLOStreamAggregate {
    uint32 streamID = 1;
    LLOStreamValue streamValue = 2;
    uint32 aggregator = 3;
}


// LLOChannelStateProto is the v31 KeyValueState record holding the full set of
// live channel definitions under a single key (c/defs). It is rewritten only
// when the definitions change; c/seqnr records the sequence number of the last
// write so readers can cache it in memory across rounds.
//
// NOTE: must serialize deterministically, hence use of repeated tuple instead
// of a map. channelDefinitions MUST be sorted ascending by channelID.
message LLOChannelStateProto {
    repeated LLOChannelIDAndDefinitionProto channelDefinitions = 1;
}

// LLOHotStateProto is the v31 KeyValueState record holding the per-round
// ("hot") state under a single key (r/agg): the state that changes on
// essentially every round.
//
// streamAggregates carries only aggregates that must survive across rounds,
// i.e. TimestampedStreamValues. Regular aggregates are recomputed fresh every
// round and are never persisted.
//
// NOTE: must serialize deterministically, hence use of repeated tuple instead
// of maps. validAfterNanoseconds and reportableChannelIDs MUST be sorted
// ascending by channelID; streamAggregates MUST be sorted ascending by
// (streamID, aggregator).
message LLOHotStateProto {
    uint64 observationTimestampNanoseconds = 1;
    repeated LLOChannelIDAndValidAfterNanosecondsProto validAfterNanoseconds = 2;
    repeated uint32 reportableChannelIDs = 3;
    repeated LLOStreamAggregate streamAggregates = 4;
}

// LLOPrecursorProto is the v31 ReportsPlusPrecursor: everything Reports needs,
// since Reports gets no KeyValueStateReader. It mirrors LLOOutcomeProtoV1 (which
// belongs to the v30 outcome and must not be changed for v31's benefit) and adds
// the sequence number of the channel-definitions record the precursor was built
// from, so that consumers can tell whether their decoded-opts cache already
// matches these definitions.
//
// NOTE: must serialize deterministically, hence use of repeated tuple instead of
// maps. channelDefinitions and validAfterNanoseconds MUST be sorted ascending by
// channelID; streamAggregates MUST be sorted ascending by (streamID, aggregator).
message LLOPrecursorProto {
    string lifeCycleStage = 1;
    uint64 observationTimestampNanoseconds = 2;
    repeated LLOChannelIDAndDefinitionProto channelDefinitions = 3;
    repeated LLOChannelIDAndValidAfterNanosecondsProto validAfterNanoseconds = 4;
    repeated LLOStreamAggregate streamAggregates = 5;
    uint64 channelStateSeqNr = 6;
}
